name: Build, push and update ArgoCD manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build-id.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get build ID
        id: build-id
        run: echo "id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-hello-world:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-hello-world:${{ steps.build-id.outputs.id }} .

      - name: Docker Push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-hello-world:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-hello-world:${{ steps.build-id.outputs.id }}

  update-manifest:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tag in Deployment manifest
        run: |
          sed -i "s#image: .*/flask-hello-world:.*#image: ${{ secrets.DOCKER_USERNAME }}/flask-hello-world:${{ needs.build-and-publish.outputs.build-id }}#" k8s/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy flask-hello-world:${{ needs.build-and-publish.outputs.build-id }}"
          git push
